<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<main>
<h1>Code_PFC</h1>
<div id="warn" class="bad" hidden>この環境では記録を保存できません(プライベートブラウズ中など)。</div>

<section id="t-today">
<div class="datebar"><button id="dprev" aria-label="前の日">‹</button><div id="dlabel"></div><button id="dnext" aria-label="次の日">›</button></div>
<div class="card" id="sum"></div>
<div class="card" id="cats" hidden></div>
<details class="card"><summary><i class="ic" data-ic="target"></i>目標設定</summary>
<div class="gg">
<label>たんぱく質(g)<input class="fi" id="gp" inputmode="decimal"></label>
<label>脂質(g)<input class="fi" id="gf" inputmode="decimal"></label>
<label>炭水化物(g)<input class="fi" id="gc" inputmode="decimal"></label>
<label>カロリー(kcal)<input class="fi" id="gk" inputmode="decimal"></label>
</div>
<button class="wide" id="gsave" type="button">目標を保存</button>
<div id="gmsg" class="rem" style="margin-top:8px" aria-live="polite"></div>
</details>
<div class="card"><div class="lh"><b><i class="ic" data-ic="edit"></i>記録</b><button id="esort" aria-pressed="false">並び替え</button></div><div id="elist"></div></div>
</section>

<section id="t-calc" hidden>
<div class="card"><b class="tt"><i class="ic" data-ic="tag"></i>名前</b>
<input class="fi" id="ename" placeholder="例:Big Mac" autocomplete="off">
<div class="qrow crow"><button type="button" data-c="朝食" aria-pressed="false">朝食</button><button type="button" data-c="昼食" aria-pressed="false">昼食</button><button type="button" data-c="夕食" aria-pressed="false">夕食</button><button type="button" data-c="補食" aria-pressed="false">補食</button></div></div>
<button class="wide" id="scanbtn" type="button" aria-expanded="false"><i class="ic" data-ic="scan"></i>ラベルから読み取る</button>
<div class="card" id="scanbox" hidden>
<textarea class="fi" id="scan" rows="3" placeholder="ここに栄養成分貼り付け" autocomplete="off"></textarea>
<div id="scanmsg" aria-live="polite"></div></div>
<div class="row p"><label for="p">たんぱく質 (P)</label><input id="p" type="text" inputmode="decimal" autocomplete="off"><span class="u">g</span></div>
<div class="row f"><label for="f">脂質 (F)</label><input id="f" type="text" inputmode="decimal" autocomplete="off"><span class="u">g</span></div>
<div class="row c"><label for="c">炭水化物 (C)</label><input id="c" type="text" inputmode="decimal" autocomplete="off"><span class="u">g</span></div>
<div class="row k"><label for="k">カロリー<small>P×4 + F×9 + C×4</small></label><input id="k" type="text" inputmode="decimal" autocomplete="off"><span class="u">kcal</span></div>
<div class="card"><label class="rem">記録する量(倍)<input class="fi" id="cmult" value="1" inputmode="decimal"></label>
<div class="qrow" id="cmq"><button type="button" data-q="0.5" aria-pressed="false">0.5</button><button type="button" data-q="0.8" aria-pressed="false">0.8</button><button type="button" data-q="1" aria-pressed="true">1</button><button type="button" data-q="1.2" aria-pressed="false">1.2</button><button type="button" data-q="1.5" aria-pressed="false">1.5</button></div></div>
<div id="msg" aria-live="polite"></div>
<div id="bar"></div>
<div id="ratio"></div>
<div class="card" id="calcdest">
<div class="rem" style="margin-bottom:8px">記録先: <span class="dt" id="dest"></span></div>
<button class="wide" id="addlog">この日に記録</button>
<button class="wide" id="addother" type="button">他の日に記録</button>
<div id="odbox" hidden style="margin-top:12px"><input class="fi" type="date" id="odate"><button class="wide" id="odgo" type="button" style="margin-top:8px">この日付に記録</button></div>
<button class="wide" id="addmy">Myリストに登録</button>
<div id="savemsg" class="rem" style="margin-top:8px" aria-live="polite"></div></div>
<button class="wide" id="clear" type="button">すべてクリア</button>
</section>

<section id="t-my" hidden>
<div class="card"><div class="rem" style="margin-bottom:8px">記録先: <span class="dt" id="mdest"></span></div><label class="rem">記録する量(倍)<input class="fi" id="mult" value="1" inputmode="decimal"></label>
<div class="qrow" id="mq"><button type="button" data-q="0.5" aria-pressed="false">0.5</button><button type="button" data-q="0.8" aria-pressed="false">0.8</button><button type="button" data-q="1" aria-pressed="true">1</button><button type="button" data-q="1.2" aria-pressed="false">1.2</button><button type="button" data-q="1.5" aria-pressed="false">1.5</button></div>
<div class="qrow crow"><button type="button" data-c="朝食" aria-pressed="false">朝食</button><button type="button" data-c="昼食" aria-pressed="false">昼食</button><button type="button" data-c="夕食" aria-pressed="false">夕食</button><button type="button" data-c="補食" aria-pressed="false">補食</button></div>
<div id="mymsg" class="rem" style="margin-top:8px" aria-live="polite"></div></div>
<div class="card"><div class="lh"><b><i class="ic" data-ic="clip"></i>Myリスト</b><button id="msort" aria-pressed="false">並び替え</button></div><div id="mylist"></div></div>
</section>

<section id="t-hist" hidden>
<div class="card">
<div id="calzone">
<div class="datebar" style="margin-top:0"><button id="mprev" aria-label="前の月">‹</button><div id="mlabel"></div><button id="mnext" aria-label="次の月">›</button></div>
<div class="cal"><div class="dow">日</div><div class="dow">月</div><div class="dow">火</div><div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div></div>
<div id="calwrap"><div class="cal" id="cal"></div></div>
</div>
<button class="wide" id="mtoday" type="button">今日</button>
</div>
<div class="card">
<b style="font-size:15px"><i class="ic" data-ic="cloud"></i>バックアップ</b>
<div class="rem" style="margin:4px 0 8px">記録を文字として書き出し、メモアプリなどに保存しておくと、データが消えても復元できます。</div>
<textarea class="fi" id="bbox" rows="3" placeholder="書き出した文字、または復元したい文字" autocomplete="off"></textarea>
<div style="display:flex;gap:8px;margin-top:8px"><button id="bout" style="flex:1" type="button">書き出し</button><button id="bin" style="flex:1" type="button">復元</button></div>
<button id="bcopy" style="width:100%;margin-top:8px" type="button">コピー</button>
<button id="bclr" style="width:100%;margin-top:8px" type="button">クリア</button>
<div id="bmsg" class="rem" style="margin-top:8px" aria-live="polite"></div>
</div>
</section>

<section id="t-data" hidden>
<div class="card">
<div class="lh"><b>過去14日の推移</b><span class="rem" id="drange"></span></div>
<div id="dchart"></div>
<div class="lg"><span><i class="b"></i>カロリー(左軸)</span><span><i style="border-color:var(--p)"></i>P</span><span><i style="border-color:var(--f)"></i>F</span><span><i style="border-color:var(--c)"></i>C(右軸)</span><span><i class="d"></i>目標</span></div>
</div>
<button class="wide" id="dlog" type="button" style="margin-top:0"><i class="ic" data-ic="list"></i>ログ</button>
</section>
</main>
<nav id="tabs"><button data-t="today"><i class="ic" data-ic="home"></i><span>ホーム</span></button><button data-t="calc"><i class="ic" data-ic="calc"></i><span>計算</span></button><button data-t="my"><i class="ic" data-ic="clip"></i><span>Myリスト</span></button><button data-t="hist"><i class="ic" data-ic="cal"></i><span>カレンダー</span></button><button data-t="data"><i class="ic" data-ic="chart"></i><span>データ</span></button></nav>
<div id="logv" hidden><div class="lw"><div class="lgh"><div class="lgt"><span></span><b><i class="ic" data-ic="list"></i>ログ</b><button id="lclose" type="button">閉じる</button></div><div id="loghd"></div></div><div id="loglist"></div></div></div>
<script src="app.js?v=1"></script>
</body>
</html>
