<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude PFC">
<title>Claude PFC</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1c2420;--sub:#66726b;--line:#dde2de;--p:#2f6fdb;--f:#d99a1e;--c:#2e9e6a;--o:#e8662a;--k:#1c2420;--err:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--card:#1b211e;--ink:#eef2ef;--sub:#93a09a;--line:#2b332f;--p:#6aa0ff;--f:#f0b64a;--c:#55c58c;--o:#ff8a3d;--k:#eef2ef;--err:#ff7b6b}}
:root[data-theme="dark"]{--bg:#121614;--card:#1b211e;--ink:#eef2ef;--sub:#93a09a;--line:#2b332f;--p:#6aa0ff;--f:#f0b64a;--c:#55c58c;--o:#ff8a3d;--k:#eef2ef;--err:#ff7b6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:480px;margin:0 auto;padding:12px 16px 120px}
h1{font-size:20px;margin:4px 0 0}
#tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5}
button{font-family:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px}
button:disabled{opacity:.3}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#tabs button{flex:1;padding:10px 2px;font-size:14px}
#tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wide{width:100%;margin-top:12px;padding:14px;font-size:16px;border-radius:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.fi{width:100%;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);padding:8px 10px}
.fi.auto{color:var(--sub);border-style:dashed}
.rem{font-size:12px;color:var(--sub);line-height:1.6}
.bad{font-size:13px;color:var(--err);line-height:1.6}
.datebar{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.datebar button{width:48px}
.datebar div{flex:1;text-align:center;font-size:17px;font-weight:600}
.srow{margin-bottom:12px}
.srow:last-child{margin-bottom:0}
.shead{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.shead span{font-size:14px;color:var(--sub);display:flex;align-items:baseline;justify-content:flex-end}
.shead .cv{font-size:24px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.shead .un{display:inline-block;width:2.8em;margin-left:4px;text-align:left;font-style:normal}
.pb{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.pb i{display:block;height:100%}
.frow{display:flex;justify-content:space-between;gap:8px}
.frow span:last-child{text-align:right}
.over{color:var(--err)}
.cg{display:grid;grid-template-columns:4.6em repeat(4,1fr);gap:8px 4px;font-size:14px;margin-top:10px;align-items:baseline}
.cg span{text-align:right;font-variant-numeric:tabular-nums}
.cg span:nth-child(5n+1){text-align:left}
.cg .h{font-size:12px;color:var(--sub)}
.cg .l{font-weight:600}
.cg .tag{font-size:13px;color:var(--ink);padding:2px 8px;margin-right:0;vertical-align:baseline}
.tag{font-style:normal;font-size:11px;font-weight:400;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px;color:var(--sub);vertical-align:1px}
.tag[data-c="朝食"]{border-color:var(--p)}
.tag[data-c="昼食"]{border-color:var(--c)}
.tag[data-c="夕食"]{border-color:var(--f)}
.tag[data-c="補食"]{border-color:var(--o)}
summary{font-size:15px;font-weight:600}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:13px;color:var(--sub)}
.gg input{margin-top:4px}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lh b{font-size:15px}
.lh button{padding:6px 12px;font-size:14px}
.lh button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qrow{display:flex;gap:6px;margin-top:8px}
.qrow button{flex:1;padding:10px 0;font-size:15px}
.qrow button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.crow button[data-c="朝食"]{--cc:var(--p)}
.crow button[data-c="昼食"]{--cc:var(--c)}
.crow button[data-c="夕食"]{--cc:var(--f)}
.crow button[data-c="補食"]{--cc:var(--o)}
.crow button{border-color:var(--cc,var(--line))}
.crow button[aria-pressed="true"]{background:var(--cc,var(--ink));border-color:var(--cc,var(--ink))}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item button{flex:none;width:auto;margin:0;white-space:nowrap;padding:10px}
.item .mv{width:44px;padding:8px 0}
.item.edit{display:block}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;font-size:12px;color:var(--sub)}
.eg input{margin-top:4px}
.ea{display:flex;gap:8px}
.item .ea button{flex:1}
.emsg{margin-top:6px}
.n{flex:1;min-width:0}
.n b{display:block;font-size:15px;overflow-wrap:anywhere}
.n span{font-size:12px;color:var(--sub)}
.row{background:var(--card);border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.row label{flex:1;font-size:16px;font-weight:600}
.row small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.row input{width:120px;font-size:22px;text-align:right;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);padding:6px 2px;font-family:inherit;border-radius:0}
.row input:focus{outline:none;border-bottom-color:var(--ink)}
.row input.auto{color:var(--sub);border-bottom-style:dashed}
.row .u{color:var(--sub);font-size:14px;width:34px}
.p{border-left-color:var(--p)}.f{border-left-color:var(--f)}.c{border-left-color:var(--c)}.k{border-left-color:var(--k)}
#msg{min-height:48px;margin:14px 2px;font-size:15px;line-height:1.6}
#msg.err{color:var(--err)}
#bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:6px 0 8px}
#bar i{display:block;height:100%}
#ratio{font-size:13px;color:var(--sub)}
#scanmsg{font-size:13px;color:var(--sub);line-height:1.6;margin-top:8px;min-height:20px}
#scanmsg.err{color:var(--err)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dow{font-size:12px;color:var(--sub);padding:4px 0}
.day{padding:8px 0 6px;border:1px solid transparent;background:transparent;border-radius:12px;font-size:16px;line-height:1}
.day span{display:block}
.dot{display:block;width:5px;height:5px;border-radius:50%;margin:5px auto 0;background:transparent}
.dot.on{background:var(--ink)}
.day.out{color:var(--sub);opacity:.5}
.day.today{border-color:var(--ink)}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel .dot.on{background:var(--bg)}
</style>
</head>
<body>
<main>
<h1>Claude PFC</h1>
<nav id="tabs"><button data-t="today">ホーム</button><button data-t="calc">計算</button><button data-t="hist">カレンダー</button><button data-t="my">myリスト</button></nav>
<div id="warn" class="bad" hidden>この環境では記録を保存できません(プライベートブラウズ中など)。</div>

<section id="t-today">
<div class="datebar"><button id="dprev" aria-label="前の日">‹</button><div id="dlabel"></div><button id="dnext" aria-label="次の日">›</button></div>
<div class="card" id="sum"></div>
<div class="card" id="cats" hidden></div>
<details class="card"><summary>目標を設定</summary>
<div class="gg">
<label>カロリー(kcal)<input class="fi" id="gk" inputmode="decimal"></label>
<label>たんぱく質(g)<input class="fi" id="gp" inputmode="decimal"></label>
<label>脂質(g)<input class="fi" id="gf" inputmode="decimal"></label>
<label>炭水化物(g)<input class="fi" id="gc" inputmode="decimal"></label>
</div>
<button class="wide" id="gsave" type="button">目標を保存</button>
<div id="gmsg" class="rem" style="margin-top:8px" aria-live="polite"></div>
</details>
<div class="card"><div class="lh"><b>記録</b><button id="esort" aria-pressed="false">並び替え</button></div><div id="elist"></div></div>
</section>

<section id="t-calc" hidden>
<div class="card"><b style="font-size:15px;display:block;margin-bottom:8px">ラベルから読み取る</b>
<textarea class="fi" id="scan" rows="3" placeholder="ここに栄養成分表示の文字を入れる" autocomplete="off"></textarea>
<div id="scanmsg" aria-live="polite"></div></div>
<div class="row p"><label for="p">たんぱく質 (P)</label><input id="p" type="text" inputmode="decimal" autocomplete="off"><span class="u">g</span></div>
<div class="row f"><label for="f">脂質 (F)</label><input id="f" type="text" inputmode="decimal" autocomplete="off"><span class="u">g</span></div>
<div class="row c"><label for="c">炭水化物 (C)</label><input id="c" type="text" inputmode="decimal" autocomplete="off"><span class="u">g</span></div>
<div class="row k"><label for="k">カロリー<small>P×4 + F×9 + C×4</small></label><input id="k" type="text" inputmode="decimal" autocomplete="off"><span class="u">kcal</span></div>
<div id="msg" aria-live="polite"></div>
<div id="bar"></div>
<div id="ratio"></div>
<div class="card" style="margin-top:16px">
<div class="rem" style="margin-bottom:8px">記録先: <span id="dest"></span></div>
<input class="fi" id="ename" placeholder="名前(例: 朝食、プロテイン)" autocomplete="off">
<div class="qrow crow"><button type="button" data-c="朝食" aria-pressed="false">朝食</button><button type="button" data-c="昼食" aria-pressed="false">昼食</button><button type="button" data-c="夕食" aria-pressed="false">夕食</button><button type="button" data-c="補食" aria-pressed="false">補食</button></div>
<button class="wide" id="addlog">この日に記録</button>
<button class="wide" id="addmy">myリストに登録</button>
<div id="savemsg" class="rem" style="margin-top:8px" aria-live="polite"></div></div>
<button class="wide" id="clear" type="button">すべてクリア</button>
</section>

<section id="t-hist" hidden>
<div class="card">
<div class="datebar" style="margin-top:0"><button id="mprev" aria-label="前の月">‹</button><div id="mlabel"></div><button id="mnext" aria-label="次の月">›</button></div>
<div class="cal"><div class="dow">月</div><div class="dow">火</div><div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div><div class="dow">日</div></div>
<div class="cal" id="cal"></div>
<div class="rem" style="margin-top:10px">点のある日は記録済みです。日付をタップすると、その日の記録を見たり、記録を追加したりできます。</div>
<button class="wide" id="mtoday" type="button">今日を選ぶ</button>
</div>
<div class="card">
<b style="font-size:15px">バックアップ</b>
<div class="rem" style="margin:4px 0 8px">記録を文字として書き出し、メモアプリなどに保存しておくと、データが消えても復元できます。</div>
<textarea class="fi" id="bbox" rows="3" placeholder="書き出した文字、または復元したい文字" autocomplete="off"></textarea>
<div style="display:flex;gap:8px;margin-top:8px"><button id="bout" style="flex:1" type="button">書き出し</button><button id="bin" style="flex:1" type="button">復元</button></div>
<div id="bmsg" class="rem" style="margin-top:8px" aria-live="polite"></div>
</div>
</section>

<section id="t-my" hidden>
<div class="card"><div class="rem" style="margin-bottom:8px">記録先: <span id="mdest"></span></div><label class="rem">記録する量(倍)<input class="fi" id="mult" value="1" inputmode="decimal"></label>
<div class="qrow" id="mq"><button type="button" data-q="1.5" aria-pressed="false">1.5</button><button type="button" data-q="1.2" aria-pressed="false">1.2</button><button type="button" data-q="1" aria-pressed="true">1</button><button type="button" data-q="0.8" aria-pressed="false">0.8</button><button type="button" data-q="0.5" aria-pressed="false">0.5</button></div>
<div class="qrow crow"><button type="button" data-c="朝食" aria-pressed="false">朝食</button><button type="button" data-c="昼食" aria-pressed="false">昼食</button><button type="button" data-c="夕食" aria-pressed="false">夕食</button><button type="button" data-c="補食" aria-pressed="false">補食</button></div>
<div id="mymsg" class="rem" style="margin-top:8px" aria-live="polite"></div></div>
<div class="card"><div class="lh"><b>myリスト</b><button id="msort" aria-pressed="false">並び替え</button></div><div id="mylist"></div></div>
</section>
</main>
<script>
(function(){
function $(i){return document.getElementById(i)}
var KEY="claude_pfc_v1";
var CATS=["朝食","昼食","夕食","補食"];
function fix(d){
  d.goal=d.goal||{};d.goalHist=d.goalHist||{};d.entries=d.entries||{};d.my=d.my||[];
  Object.keys(d.entries).forEach(function(k){(d.entries[k]||[]).forEach(function(e){if(e.cat==="間食")e.cat="補食"})});
  return d;
}
function load(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&typeof d==="object")return fix(d)}}catch(e){}return fix({})}
var D=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(x){$("warn").hidden=false}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function half(s){return String(s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}).replace(/[．]/g,".").replace(/[，]/g,",")}
function num(s){s=half(s).replace(/,/g,"").trim();if(s==="")return null;var n=Number(s);return isFinite(n)&&n>=0?n:NaN}
function fmt(n){return String(Math.round(n*10)/10)}
function f1(n){return(Math.round(n*10)/10).toFixed(1)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function p2(n){return n<10?"0"+n:""+n}
function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function shift(s,n){var a=s.split("-");return ymd(new Date(+a[0],+a[1]-1,+a[2]+n))}
function lab(s){var a=s.split("-"),d=new Date(+a[0],+a[1]-1,+a[2]);return(+a[1])+"月"+(+a[2])+"日("+"日月火水木金土"[d.getDay()]+")"}
var cur=ymd(new Date());
var vy=+cur.slice(0,4),vm=+cur.slice(5,7);
var sortE=false,sortM=false,editE=null,editM=null;
var cat="";
function goalFor(d){var best=null,k;for(k in D.goalHist){if(k<=d&&(best===null||k>best))best=k}return best===null?D.goal:D.goalHist[best]}
function tot(l){var t={p:0,f:0,c:0,k:0};l.forEach(function(e){for(var k in t)t[k]+=e[k]});return t}
function add(date,e){e.id=Date.now()+"_"+Math.floor(Math.random()*1e4);(D.entries[date]=D.entries[date]||[]).push(e);save()}
function mv(arr,id,dir){var i=-1,j,t;arr.forEach(function(x,n){if(String(x.id)===id)i=n});j=i+dir;if(i<0||j<0||j>=arr.length)return false;t=arr[i];arr[i]=arr[j];arr[j]=t;return true}
function solve(v,m){
  if(m==="k")return v.p*4+v.f*9+v.c*4;
  if(m==="p")return(v.k-v.f*9-v.c*4)/4;
  if(m==="f")return(v.k-v.p*4-v.c*4)/9;
  return(v.k-v.p*4-v.f*9)/4;
}
function form(e,isRec){
  var sel="";
  if(isRec){
    sel='<select class="fi" data-k="cat" style="margin-top:8px"><option value="">未分類</option>'
    +CATS.map(function(c){return'<option value="'+c+'"'+(e.cat===c?" selected":"")+'>'+c+'</option>'}).join("")+'</select>';
  }
  return'<div class="item edit"><div class="n"><input class="fi" data-k="name" placeholder="名前" value="'+esc(e.name||"")+'">'+sel
  +'<div class="eg"><label>たんぱく質(g)<input class="fi" data-k="p" inputmode="decimal" value="'+fmt(e.p)+'"></label>'
  +'<label>脂質(g)<input class="fi" data-k="f" inputmode="decimal" value="'+fmt(e.f)+'"></label>'
  +'<label>炭水化物(g)<input class="fi" data-k="c" inputmode="decimal" value="'+fmt(e.c)+'"></label>'
  +'<label>カロリー(kcal)<input class="fi" data-k="k" inputmode="decimal" value="'+fmt(e.k)+'"></label></div>'
  +'<div class="ea"><button data-save="'+e.id+'">保存</button><button data-cancel="1">キャンセル</button></div>'
  +'<div class="bad emsg"></div></div></div>';
}
function fv(box,k){return box.querySelector('[data-k="'+k+'"]')}
function calcForm(box,from){
  var a=box.dataset.auto;
  if(a){
    if(from!==a){var ai=fv(box,a);ai.value="";ai.classList.remove("auto")}
    else{fv(box,a).classList.remove("auto")}
    delete box.dataset.auto;
  }
  var em=[],v={},bad=false,msg=box.querySelector(".emsg");
  msg.textContent="";
  ["p","f","c","k"].forEach(function(k){var n=num(fv(box,k).value);if(n===null)em.push(k);else if(isNaN(n))bad=true;v[k]=n});
  if(bad||em.length!==1)return;
  var r=solve(v,em[0]);
  if(r<0){msg.textContent="計算結果がマイナスになります。入力値を確認してください。";return}
  var inp=fv(box,em[0]);inp.value=fmt(r);inp.classList.add("auto");box.dataset.auto=em[0];
}
function fchange(e){
  var t=e.target,box=t.closest?t.closest(".edit"):null;
  if(box&&t.dataset.k&&t.dataset.k!=="name"&&t.dataset.k!=="cat")calcForm(box,t.dataset.k);
}
function readForm(box){
  var o={name:fv(box,"name").value.trim()},v={},em=[],bad=false,msg=box.querySelector(".emsg");
  var ce=fv(box,"cat");if(ce)o.cat=ce.value;
  ["p","f","c","k"].forEach(function(k){var n=num(fv(box,k).value);if(n===null)em.push(k);else if(isNaN(n))bad=true;v[k]=n});
  if(bad){msg.textContent="数字(0以上)で入力してください。";return null}
  if(em.length>=2){msg.textContent="P・F・C・カロリーのうち、3つ以上を入力してください。";return null}
  if(em.length===1){
    var r=solve(v,em[0]);
    if(r<0){msg.textContent="計算結果がマイナスになります。入力値を確認してください。";return null}
    v[em[0]]=Math.round(r*10)/10;
  }
  o.p=v.p;o.f=v.f;o.c=v.c;o.k=v.k;
  return o;
}

var ids=["p","f","c","k"],el={},auto=null;
ids.forEach(function(i){el[i]=$(i)});
var msg=$("msg"),bar=$("bar"),ratio=$("ratio"),scan=$("scan"),scanmsg=$("scanmsg");
function setMsg(t,e){msg.textContent=t;msg.className=e?"err":""}
function draw(p,f,c){
  var kp=p*4,kf=f*9,kc=c*4,t=kp+kf+kc;
  if(!(t>0)){bar.innerHTML="";ratio.textContent="";return}
  var a=kp/t*100,b=kf/t*100,d=kc/t*100;
  bar.innerHTML='<i style="width:'+a+'%;background:var(--p)"></i><i style="width:'+b+'%;background:var(--f)"></i><i style="width:'+d+'%;background:var(--c)"></i>';
  ratio.textContent="カロリー比 P "+fmt(a)+"% / F "+fmt(b)+"% / C "+fmt(d)+"%";
}
function calc(from){
  if(auto&&from!==auto){el[auto].classList.remove("auto");el[auto].value="";auto=null}
  if(from&&from===auto){el[auto].classList.remove("auto");auto=null}
  var v={},empty=[],bad=false;
  ids.forEach(function(i){var n=num(el[i].value);if(n===null)empty.push(i);else if(isNaN(n))bad=true;v[i]=n});
  bar.innerHTML="";ratio.textContent="";
  if(bad){setMsg("数字(0以上)で入力してください。",true);return}
  if(empty.length>=2){setMsg(empty.length===4?"":"あと"+(empty.length-1)+"項目入力すると計算します。",false);return}
  if(empty.length===0){
    var t=v.p*4+v.f*9+v.c*4,d=v.k-t;
    setMsg(Math.abs(d)<0.5?"4項目は一致しています。":"P・F・Cから計算すると "+fmt(t)+" kcal です(入力との差 "+(d>0?"+":"")+fmt(d)+" kcal)。",false);
    draw(v.p,v.f,v.c);return}
  var m=empty[0],r,name={p:"たんぱく質",f:"脂質",c:"炭水化物",k:"カロリー"}[m];
  r=solve(v,m);
  if(r<0){setMsg("計算結果がマイナスになります。入力値がカロリーと合っているか確認してください。",true);return}
  el[m].value=fmt(r);el[m].classList.add("auto");auto=m;
  setMsg(name+"は "+fmt(r)+(m==="k"?" kcal":" g")+" です。",false);
  draw(m==="p"?r:v.p,m==="f"?r:v.f,m==="c"?r:v.c);
}
var NUM="([0-9]+(?:\\.[0-9]+)?)";
var KEYS={
  p:new RegExp("(?:たんぱく質|タンパク質|蛋白質|たん白質)[^0-9\\n]{0,8}?"+NUM),
  f:new RegExp("脂質[^0-9\\n]{0,8}?"+NUM),
  c:new RegExp("炭水化物[^0-9\\n]{0,8}?"+NUM)
};
function parse(){
  var t=half(scan.value).replace(/\s+/g," ").replace(/\s?\.\s?/g,".");
  if(t.replace(/\s/g,"")===""){scanmsg.textContent="";scanmsg.className="";return}
  var got={},n=0,m;
  var km=t.match(/([0-9]+(?:\.[0-9]+)?)\s*(?:kcal|Kcal|KCAL|キロカロリー)/);
  if(km){got.k=Number(km[1]);n++}
  else{m=t.match(new RegExp("(?:エネルギー|熱量|カロリー)[^0-9\\n]{0,8}?"+NUM));if(m){got.k=Number(m[1]);n++}}
  ["p","f","c"].forEach(function(k){var r=t.match(KEYS[k]);if(r){got[k]=Number(r[1]);n++}});
  if(n===0){scanmsg.textContent="数値を読み取れませんでした。たんぱく質・脂質・炭水化物などの文字が入っているか確認してください。";scanmsg.className="err";return}
  ids.forEach(function(i){el[i].value="";el[i].classList.remove("auto")});auto=null;
  ids.forEach(function(i){if(got[i]!==undefined)el[i].value=fmt(got[i])});
  var names={k:"カロリー",p:"P",f:"F",c:"C"},found=[];
  ["k","p","f","c"].forEach(function(i){if(got[i]!==undefined)found.push(names[i])});
  scanmsg.textContent="読み取れた項目: "+found.join("・")+"。数値がラベルと合っているか確認してください(1食分か100gあたりかにも注意)。";scanmsg.className="";
  calc(null);
}
scan.addEventListener("input",parse);
ids.forEach(function(i){el[i].addEventListener("input",function(){calc(i)})});
function clr(){ids.forEach(function(i){el[i].value="";el[i].classList.remove("auto")});auto=null;scan.value="";scanmsg.textContent="";scanmsg.className="";setMsg("",false);bar.innerHTML="";ratio.textContent=""}
function csync(){
  [].forEach.call(document.querySelectorAll(".crow button"),function(b){
    b.setAttribute("aria-pressed",b.dataset.c===cat?"true":"false");
  });
}
[].forEach.call(document.querySelectorAll(".crow"),function(row){
  row.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;cat=(cat===b.dataset.c)?"":b.dataset.c;csync()});
});
$("clear").onclick=function(){clr();$("ename").value="";cat="";csync();sm("")};

function sm(t,e){var s=$("savemsg");s.textContent=t;s.className=e?"bad":"rem"}
function vals(){var v={};for(var i=0;i<4;i++){var n=num(el[ids[i]].value);if(n===null||isNaN(n))return null;v[ids[i]]=n}return v}
$("addlog").onclick=function(){
  var v=vals();if(!v){sm("P・F・C・カロリーの4項目がそろうと記録できます。",1);return}
  v.name=$("ename").value.trim();if(cat)v.cat=cat;add(cur,v);$("ename").value="";clr();sm(lab(cur)+"に記録しました。「ホーム」で確認できます。");
};
$("addmy").onclick=function(){
  var v=vals(),nm=$("ename").value.trim();
  if(!v||!nm){sm("名前と4項目を入力してください。",1);return}
  v.name=nm;v.id=Date.now()+"_"+Math.floor(Math.random()*1e4);D.my.push(v);save();$("ename").value="";sm("myリストに登録しました。");
};

var KS=[["k","カロリー","kcal","--k"],["p","たんぱく質","g","--p"],["f","脂質","g","--f"],["c","炭水化物","g","--c"]];
function dest(){$("dest").textContent=lab(cur)}
function catHtml(l){
  var h="",any=false;
  CATS.concat([""]).forEach(function(c){
    var sub=l.filter(function(e){return(e.cat||"")===c});
    if(!sub.length)return;
    var t=tot(sub);
    if(!any){h+='<span class="h"></span><span class="h">kcal</span><span class="h">P</span><span class="h">F</span><span class="h">C</span>';any=true}
    h+='<span class="l"><i class="tag" data-c="'+esc(c)+'">'+(c||"未分類")+'</i></span><span>'+f1(t.k)+'</span><span>'+f1(t.p)+'</span><span>'+f1(t.f)+'</span><span>'+f1(t.c)+'</span>';
  });
  return any?'<b style="font-size:15px">分類別</b><div class="cg">'+h+'</div>':"";
}
var gShown=null;
function rToday(){
  dest();$("dlabel").textContent=lab(cur)+(cur===ymd(new Date())?" 今日":"");
  if(gShown!==cur){setGoals();gShown=cur}
  var G=goalFor(cur);
  var l=D.entries[cur]||[],t=tot(l),h="";
  KS.forEach(function(s){var g=G[s[0]]||0,v=t[s[0]];
    h+='<div class="srow"><div class="shead"><b>'+s[1]+'</b><span><b class="cv">'+f1(v)+'</b><i class="un">'+s[2]+'</i></span></div>';
    if(g){var o=v>g;h+='<div class="pb"><i style="width:'+Math.min(100,v/g*100)+'%;background:var('+(o?"--err":s[3])+')"></i></div><div class="rem frow"><span'+(o?' class="over"':'')+'>'+(o?fmt(v-g)+s[2]+" 超過":"あと "+fmt(g-v)+s[2])+'</span><span>目標 '+fmt(g)+' '+s[2]+'</span></div>'}
    h+='</div>'});
  if(!G.k&&!G.p&&!G.f&&!G.c)h+='<div class="rem">「目標を設定」を開くと、残りが表示されます。</div>';
  $("sum").innerHTML=h;
  var ch=catHtml(l),cb=$("cats");cb.innerHTML=ch;cb.hidden=!ch;
  if(l.length<2)sortE=false;
  var sb=$("esort");sb.hidden=l.length<2;sb.textContent=sortE?"完了":"並び替え";sb.setAttribute("aria-pressed",sortE?"true":"false");
  $("elist").innerHTML=l.length?l.map(function(e,i){
    if(editE===String(e.id))return form(e,true);
    var b=sortE?'<button class="mv" data-up="'+e.id+'" aria-label="上へ"'+(i===0?" disabled":"")+'>↑</button><button class="mv" data-dn="'+e.id+'" aria-label="下へ"'+(i===l.length-1?" disabled":"")+'>↓</button>':'<button data-edit="'+e.id+'">編集</button><button data-del="'+e.id+'">削除</button>';
    return'<div class="item"><div class="n"><b>'+(e.cat?'<i class="tag" data-c="'+esc(e.cat)+'">'+esc(e.cat)+'</i>':'')+esc(e.name||"名称なし")+'</b><span>P '+fmt(e.p)+" / F "+fmt(e.f)+" / C "+fmt(e.c)+" / "+fmt(e.k)+' kcal</span></div>'+b+'</div>'}).join(""):'<div class="rem">この日の記録はまだありません。「計算」または「myリスト」から記録できます。</div>';
}
$("esort").onclick=function(){sortE=!sortE;editE=null;rToday()};
$("elist").addEventListener("change",fchange);
$("elist").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var l=D.entries[cur]||[];
  if(b.dataset.del){
    if(!confirm("削除しますか?"))return;
    D.entries[cur]=l.filter(function(x){return String(x.id)!==b.dataset.del});
    if(!D.entries[cur].length)delete D.entries[cur];save();rToday();return;
  }
  if(b.dataset.edit){editE=b.dataset.edit;rToday();return}
  if(b.dataset.cancel){editE=null;rToday();return}
  if(b.dataset.save){
    var o=readForm(b.closest(".edit"));if(!o)return;
    l.forEach(function(x){if(String(x.id)===b.dataset.save){x.name=o.name;x.p=o.p;x.f=o.f;x.c=o.c;x.k=o.k;if(o.cat)x.cat=o.cat;else delete x.cat}});
    save();editE=null;rToday();return;
  }
  if(b.dataset.up||b.dataset.dn){
    if(mv(l,b.dataset.up||b.dataset.dn,b.dataset.up?-1:1)){save();rToday()}
  }
});
$("dprev").onclick=function(){cur=shift(cur,-1);editE=null;rToday()};
$("dnext").onclick=function(){cur=shift(cur,1);editE=null;rToday()};
$("dlabel").onclick=function(){cur=ymd(new Date());editE=null;rToday()};

var gAuto=null;
function gm(t,e){var s=$("gmsg");s.textContent=t;s.className=e?"bad":"rem"}
function gclr(){if(gAuto){var a=$("g"+gAuto);a.value="";a.classList.remove("auto");gAuto=null}}
function setGoals(){gAuto=null;gm("");var G=goalFor(cur);["k","p","f","c"].forEach(function(k){var i=$("g"+k);i.value=G[k]||"";i.classList.remove("auto")})}
["k","p","f","c"].forEach(function(k){var i=$("g"+k);i.addEventListener("input",function(){
  gm("");
  if(gAuto&&gAuto!==k)gclr();
  if(gAuto===k){i.classList.remove("auto");gAuto=null}
  var em=[],v={},bad=false;
  ["p","f","c","k"].forEach(function(x){var m=num($("g"+x).value);if(m===null)em.push(x);else if(isNaN(m))bad=true;v[x]=m});
  if(bad||em.length!==1)return;
  var r=solve(v,em[0]);
  if(r<0){gm("計算結果がマイナスになります。入力値を確認してください。",1);return}
  r=Math.round(r*10)/10;
  var t=$("g"+em[0]);t.value=fmt(r);t.classList.add("auto");gAuto=em[0];
})});
$("gsave").onclick=function(){
  var g={},bad=false;
  ["k","p","f","c"].forEach(function(k){var n=num($("g"+k).value);if(n!==null&&isNaN(n))bad=true;g[k]=(n===null||isNaN(n))?0:n});
  if(bad){gm("数字(0以上)で入力してください。",1);return}
  D.goalHist[cur]=g;save();
  ["k","p","f","c"].forEach(function(k){$("g"+k).classList.remove("auto")});gAuto=null;
  rToday();gm(lab(cur)+"以降の目標を保存しました。");
};

function rCal(){
  $("mlabel").textContent=vy+"年"+vm+"月";
  var off=(new Date(vy,vm-1,1).getDay()+6)%7;
  var rows=Math.ceil((off+new Date(vy,vm,0).getDate())/7);
  var today=ymd(new Date()),h="",i,d,s,has;
  for(i=0;i<rows*7;i++){
    d=new Date(vy,vm-1,1-off+i);s=ymd(d);has=(D.entries[s]||[]).length>0;
    h+='<button class="day'+(d.getMonth()===vm-1?"":" out")+(s===today?" today":"")+(s===cur?" sel":"")+'" data-d="'+s+'" aria-label="'+lab(s)+(has?" 記録あり":"")+'"><span>'+d.getDate()+'</span><i class="dot'+(has?" on":"")+'"></i></button>';
  }
  $("cal").innerHTML=h;
}
$("cal").addEventListener("click",function(e){var b=e.target.closest(".day");if(b){cur=b.dataset.d;show("today")}});
$("mprev").onclick=function(){vm--;if(vm<1){vm=12;vy--}rCal()};
$("mnext").onclick=function(){vm++;if(vm>12){vm=1;vy++}rCal()};
$("mtoday").onclick=function(){cur=ymd(new Date());vy=+cur.slice(0,4);vm=+cur.slice(5,7);rCal()};
function bm(t,e){var s=$("bmsg");s.textContent=t;s.className=e?"bad":"rem"}
$("bout").onclick=function(){
  var s=JSON.stringify(D),b=$("bbox");b.value=s;
  var ng=function(){b.focus();b.select();bm("枠内の文字を全選択してコピーし、メモアプリなどに保存してください。")};
  try{navigator.clipboard.writeText(s).then(function(){bm("コピーしました。メモアプリなどに貼り付けて保存してください。")},ng)}catch(x){ng()}
};
$("bin").onclick=function(){
  var s=$("bbox").value.trim();
  if(!s){bm("復元したい文字を、枠に貼り付けてください。",1);return}
  try{
    var o=JSON.parse(s);
    if(!o||typeof o!=="object"||(!o.entries&&!o.my&&!o.goal&&!o.goalHist))throw 0;
    if(!confirm("今のデータを、貼り付けた内容で置き換えます。よろしいですか?"))return;
    D=fix(o);save();gShown=null;rCal();bm("復元しました。");
  }catch(x){bm("読み込めませんでした。書き出した文字を、そのまま貼り付けてください。",1)}
};

function qsync(){
  var m=num($("mult").value);
  [].forEach.call(document.querySelectorAll("#mq button"),function(b){
    b.setAttribute("aria-pressed",(m!==null&&!isNaN(m)&&Number(b.dataset.q)===m)?"true":"false");
  });
}
$("mq").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;$("mult").value=b.dataset.q;qsync()});
$("mult").addEventListener("input",qsync);

function rMy(){
  var l=D.my;
  $("mdest").textContent=lab(cur);
  qsync();csync();
  if(l.length<2)sortM=false;
  var sb=$("msort");sb.hidden=l.length<2;sb.textContent=sortM?"完了":"並び替え";sb.setAttribute("aria-pressed",sortM?"true":"false");
  $("mylist").innerHTML=l.length?l.map(function(e,i){
    if(editM===String(e.id))return form(e,false);
    var b=sortM?'<button class="mv" data-up="'+e.id+'" aria-label="上へ"'+(i===0?" disabled":"")+'>↑</button><button class="mv" data-dn="'+e.id+'" aria-label="下へ"'+(i===l.length-1?" disabled":"")+'>↓</button>':'<button data-use="'+e.id+'">記録</button><button data-edit="'+e.id+'">編集</button><button data-mdel="'+e.id+'">削除</button>';
    return'<div class="item"><div class="n"><b>'+esc(e.name)+'</b><span>P '+fmt(e.p)+" / F "+fmt(e.f)+" / C "+fmt(e.c)+" / "+fmt(e.k)+' kcal</span></div>'+b+'</div>'}).join(""):'<div class="rem">myリストは空です。「計算」で4項目を入れて名前を付け、「myリストに登録」を押してください。</div>';
}
$("msort").onclick=function(){sortM=!sortM;editM=null;rMy()};
$("mylist").addEventListener("change",fchange);
$("mylist").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var it;
  if(b.dataset.use){
    D.my.forEach(function(y){if(String(y.id)===b.dataset.use)it=y});if(!it)return;
    var m=num($("mult").value);if(!m||isNaN(m))m=1;
    var r=function(v){return Math.round(v*m*10)/10};
    var ne={name:it.name+(m!==1?" ×"+m:""),p:r(it.p),f:r(it.f),c:r(it.c),k:r(it.k)};
    if(cat)ne.cat=cat;
    add(cur,ne);
    $("mymsg").textContent=lab(cur)+"に記録しました。";
  }else if(b.dataset.mdel){
    if(confirm("myリストから削除しますか?")){D.my=D.my.filter(function(y){return String(y.id)!==b.dataset.mdel});save();rMy()}
  }else if(b.dataset.edit){
    editM=b.dataset.edit;rMy();
  }else if(b.dataset.cancel){
    editM=null;rMy();
  }else if(b.dataset.save){
    var box=b.closest(".edit"),o=readForm(box);if(!o)return;
    if(!o.name){box.querySelector(".emsg").textContent="名前を入力してください。";return}
    D.my.forEach(function(y){if(String(y.id)===b.dataset.save){y.name=o.name;y.p=o.p;y.f=o.f;y.c=o.c;y.k=o.k}});
    save();editM=null;rMy();
  }else if(b.dataset.up||b.dataset.dn){
    if(mv(D.my,b.dataset.up||b.dataset.dn,b.dataset.up?-1:1)){save();rMy()}
  }
});

function show(t){
  sortE=false;sortM=false;editE=null;editM=null;
  ["today","calc","hist","my"].forEach(function(x){$("t-"+x).hidden=x!==t});
  [].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.setAttribute("aria-selected",b.dataset.t===t?"true":"false")});
  if(t==="today")rToday();
  if(t==="hist"){vy=+cur.slice(0,4);vm=+cur.slice(5,7);rCal();bm("")}
  if(t==="my"){rMy();$("mymsg").textContent=""}
  if(t==="calc")dest();
  window.scrollTo(0,0);
}
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(b)show(b.dataset.t)});
show("today");
})();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}
